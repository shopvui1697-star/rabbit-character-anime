services:
  # MySQL runs on an existing external server — no local DB container here.
  # Point DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD/DB_SSL in backend/.env at it.
  db-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rabbit-db-init
    env_file:
      - backend/.env
    command: ["node", "dist/db/setup.js"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rabbit-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      NINEROUTER_URL: http://host.docker.internal:20128
    ports:
      - "3001:3001"
    volumes:
      - ./backend/logs:/app/backend/logs
    depends_on:
      db-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
        NEXT_PUBLIC_WS_URL: ws://localhost:3001/ws
        NEXT_PUBLIC_DEBUG: "true"
    container_name: rabbit-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
